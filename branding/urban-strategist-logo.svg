<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .word-dark { font-family:'Fraunces', serif; font-weight:500; fill:#EDEAE2; }
      .word-light { font-family:'Fraunces', serif; font-weight:500; fill:#1f2428; }
      .eyebrow-amber { font-family:'JetBrains Mono', monospace; font-weight:500; fill:#E8A33D; letter-spacing:3px; }
      .eyebrow-teal { font-family:'JetBrains Mono', monospace; font-weight:500; fill:#0e7c66; letter-spacing:3px; }
    </style>
  </defs>

  <!-- ===== Horizontal lockup — dark (primary) ===== -->
  <rect x="20" y="20" width="420" height="160" rx="6" fill="#14171C"/>
  <!-- icon -->
  <g transform="translate(50,50)">
    <path d="M8,92 L48,58 L70,74 L100,20" fill="none" stroke="#EDEAE2" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="58" r="6" fill="#E8A33D"/>
    <circle cx="70" cy="74" r="6" fill="#4FD1C5"/>
    <circle cx="100" cy="20" r="9" fill="none" stroke="#EDEAE2" stroke-width="2.25"/>
  </g>
  <text x="170" y="100" class="word-dark" font-size="30">Steven Needham</text>
  <text x="170" y="128" class="eyebrow-amber" font-size="11">URBAN STRATEGIST</text>
  <text x="170" y="146" class="eyebrow-amber" font-size="11" fill="#4FD1C5">OPS · SYSTEMS · CIVIC TECH</text>

  <!-- ===== Horizontal lockup — light / paper ===== -->
  <rect x="460" y="20" width="420" height="160" rx="6" fill="#faf9f6" stroke="#e4e1d8"/>
  <g transform="translate(490,50)">
    <path d="M8,92 L48,58 L70,74 L100,20" fill="none" stroke="#1f2428" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="58" r="6" fill="#E8A33D"/>
    <circle cx="70" cy="74" r="6" fill="#0e7c66"/>
    <circle cx="100" cy="20" r="9" fill="none" stroke="#1f2428" stroke-width="2.25"/>
  </g>
  <text x="610" y="100" class="word-light" font-size="30">Steven Needham</text>
  <text x="610" y="128" class="eyebrow-amber" font-size="11">URBAN STRATEGIST</text>
  <text x="610" y="146" class="eyebrow-teal" font-size="11">OPS · SYSTEMS · CIVIC TECH</text>

  <!-- ===== Icon only — dark ===== -->
  <rect x="20" y="220" width="180" height="180" rx="6" fill="#14171C"/>
  <g transform="translate(48,250)">
    <path d="M8,110 L58,68 L84,88 L124,24" fill="none" stroke="#EDEAE2" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="68" r="8" fill="#E8A33D"/>
    <circle cx="84" cy="88" r="8" fill="#4FD1C5"/>
    <circle cx="124" cy="24" r="12" fill="none" stroke="#EDEAE2" stroke-width="2.75"/>
  </g>

  <!-- ===== Icon only — light ===== -->
  <rect x="240" y="220" width="180" height="180" rx="6" fill="#faf9f6" stroke="#e4e1d8"/>
  <g transform="translate(268,250)">
    <path d="M8,110 L58,68 L84,88 L124,24" fill="none" stroke="#1f2428" stroke-opacity="0.35" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="68" r="8" fill="#E8A33D"/>
    <circle cx="84" cy="88" r="8" fill="#0e7c66"/>
    <circle cx="124" cy="24" r="12" fill="none" stroke="#1f2428" stroke-width="2.75"/>
  </g>

  <!-- ===== Notes ===== -->
  <text x="460" y="240" font-family="JetBrains Mono, monospace" font-size="11" fill="#8a8f98">MARK: route line (path traveled) → amber node</text>
  <text x="460" y="258" font-family="JetBrains Mono, monospace" font-size="11" fill="#8a8f98">(ops/leadership) → teal node (systems/tools) →</text>
  <text x="460" y="276" font-family="JetBrains Mono, monospace" font-size="11" fill="#8a8f98">hollow hub node (the destination: a mobility hub).</text>
  <text x="460" y="304" font-family="JetBrains Mono, monospace" font-size="11" fill="#8a8f98">Same mark as assets/logo.svg — reused, not remixed,</text>
  <text x="460" y="322" font-family="JetBrains Mono, monospace" font-size="11" fill="#8a8f98">so consulting materials stay visually tied to the</text>
  <text x="460" y="340" font-family="JetBrains Mono, monospace" font-size="11" fill="#8a8f98">portfolio and civic projects.</text>
</svg>
